<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karallion</title>
<meta name="description" content="O jogo diário das respostas raras. A resposta óbvia vale pouco.">
<meta name="theme-color" content="#0A0912">
<meta property="og:type" content="website">
<meta property="og:title" content="KARALLION">
<meta property="og:description" content="O jogo diário das respostas raras. A resposta óbvia vale pouco.">
<meta property="og:url" content="https://karallion.netlify.app/">
<meta property="og:image" content="https://karallion.netlify.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Manrope:wght@500;600;700;800&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: feed vertical que desce a cada categoria, com uma régua fixa à direita onde a berinjela sobe conforme a pontuação. Visual escuro de propósito, em um tema só. */
:root{
  --bg:#0A0912; --surface:#15131F; --surface-2:#1E1B2B; --line:#2C2840; --fg:#F5F2FF; --muted:#8F89AA;
  --t0:#FF4D6D; --t1:#5E5A73; --t2:#FF9F1C; --t3:#2EE6A6; --t4:#3DA9FC; --t5:#FF2BD6;
  --on-tier:#0A0912;
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20% -30% auto;height:70vh;background:radial-gradient(closest-side,color-mix(in srgb,var(--glow,var(--t5)) 28%,transparent),transparent);pointer-events:none;z-index:0;transition:background .6s}
.app{position:relative;z-index:1;max-width:520px;min-height:100%;margin:0 auto;padding-inline:16px;padding-block:14px 18px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:1.45rem;letter-spacing:.01em;line-height:1;background:linear-gradient(90deg,var(--t5),var(--t4) 55%,var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-row{display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;flex:none}
.icon-btn{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;font-weight:800;cursor:pointer;font-size:1rem}
.trail{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:5px}
.extra-tag{color:var(--t5)}
.seg{height:6px;border-radius:99px;background:var(--surface-2);transition:background .4s,transform .3s}
.seg.cur{background:var(--fg);transform:scaleY(1.4)}
main{display:flex;flex-direction:column;gap:20px;min-height:0}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prompt{font-family:var(--display);font-size:clamp(2rem,9.5vw,3.1rem);line-height:1.02;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.lives{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.85rem;font-weight:600}
.life{width:22px;height:6px;border-radius:99px;background:var(--t3)}
.life.gone{background:var(--surface-2)}
.clock{display:flex;align-items:center;gap:12px}
.clock .secs{font-family:var(--display);font-size:1.6rem;line-height:1;min-width:2.2ch;font-variant-numeric:tabular-nums}
.timer{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--t3);border-radius:99px;transform-origin:left center;transition:transform .2s linear,background .3s}
.clock.urgent .secs{color:var(--t0)}
.clock.urgent .timer i{background:var(--t0)}
@keyframes pulse{50%{opacity:.45}}
.clock.urgent .secs{animation:pulse .5s infinite}
.toast{min-height:1.5em;font-weight:800;color:var(--t0)}
.bar{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;transition:border-color .2s}
.bar:focus-within{border-color:var(--t4)}
.bar input{flex:1;min-width:0;background:none;border:none;color:var(--fg);font:inherit;font-size:1.1rem;font-weight:600;outline:none;padding-block:10px}
.bar input::placeholder{color:var(--muted)}
.bar input:focus-visible{outline:none}
.go{flex:none;height:48px;padding-inline:20px;border-radius:999px;border:none;background:var(--fg);color:var(--bg);font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.go:active{transform:scale(.96)}
.skip{align-self:center;background:none;border:none;color:var(--muted);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--t4);outline-offset:3px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s}

/* revelação em tela cheia */
.reveal{position:fixed;inset:0;z-index:10;background:var(--tier);color:var(--on-tier);display:flex;flex-direction:column;justify-content:center;gap:18px;padding-inline:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden}
.reveal.dim{color:var(--fg)}
.reveal canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.reveal .inner{position:relative;max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.phrase{font-family:var(--display);font-size:clamp(2.4rem,12vw,4.4rem);line-height:.98;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.big-pts{font-family:var(--display);font-size:clamp(3.5rem,18vw,6rem);line-height:1;font-variant-numeric:tabular-nums}
.big-pts small{font-family:var(--body);font-weight:800;font-size:1rem;margin-left:6px;opacity:.75}
.said{font-size:1.05rem;font-weight:600;opacity:.85}
.said strong{font-weight:800;opacity:1}
.next{align-self:flex-start;margin-top:8px;height:54px;padding-inline:28px;border-radius:999px;border:none;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--on-tier);color:var(--tier)}
.reveal.dim .next{background:var(--fg);color:var(--bg)}
@keyframes slam{0%{transform:scale(1.6) rotate(-4deg);opacity:0}60%{transform:scale(.95) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.slam{animation:slam .55s cubic-bezier(.2,.9,.3,1.2) both}
.rise{animation:rise .45s ease-out both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
.reveal.t5{background:linear-gradient(135deg,var(--t5),#9B5CFF 50%,var(--t4))}

/* final */
.score-card{display:flex;flex-direction:column;gap:6px}
.total{font-family:var(--display);font-size:clamp(4rem,22vw,7rem);line-height:.95;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--display);font-size:clamp(1.4rem,6.5vw,2rem);line-height:1.05;text-wrap:balance}
.ruler{display:flex;flex-direction:column;gap:10px}
.egg-wrap{height:clamp(150px,42vw,230px);display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.egg{display:inline-block;font-size:clamp(150px,42vw,230px);line-height:1;transform:scale(var(--k));transform-origin:50% 100%;filter:drop-shadow(0 10px 24px color-mix(in srgb,var(--t5) 35%,transparent))}
@keyframes grow{from{transform:scale(.1) rotate(-20deg)}70%{transform:scale(calc(var(--k)*1.12)) rotate(6deg)}to{transform:scale(var(--k))}}
.grow{animation:grow 1s cubic-bezier(.2,.9,.3,1.2) both}
.tape{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.tape i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9B5CFF,var(--t5))}
.tape-marks{display:flex;justify-content:space-between;font-size:.75rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.pts-line{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px}
.chip{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--c);color:var(--on-tier);white-space:nowrap}
.chip.dim{color:var(--fg)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:800;overflow-wrap:anywhere}
.row .t span{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.row .p{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.share{font-size:1.4rem;letter-spacing:.15em;text-align:center;padding:14px;background:var(--surface);border-radius:16px;user-select:all}
.cta{height:56px;border-radius:999px;border:none;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;background:linear-gradient(90deg,var(--t5),var(--t4));color:#fff}

/* painel */
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding-inline:20px;padding-top:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.sheet h2{font-family:var(--display);font-size:1.3rem;margin:0}
.sheet p{margin:0;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.6)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
pre.rej{margin:0;white-space:pre-wrap;font:inherit;font-size:.9rem;background:var(--bg);border-radius:12px;padding:12px;color:var(--fg);user-select:all}
.rank{display:flex;flex-direction:column;gap:8px}
.rank h3{font-family:var(--display);font-size:1.2rem;margin:0}
.rk{display:grid;grid-template-columns:28px 32px 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 14px}
.rk.me{outline:1.5px solid var(--t4)}
.rk .pos{font-family:var(--display);color:var(--muted)}
.rk img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.rk .nm{min-width:0}
.rk .nm b{display:block;font-weight:800;overflow-wrap:anywhere}
.rk .nm span{font-size:.85rem;letter-spacing:.1em}
.rk .p{font-family:var(--display);font-variant-numeric:tabular-nums}
.cover{display:flex;flex-direction:column;gap:22px;padding-block:4vh}
.cover .eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wordmark{font-family:var(--display);font-size:clamp(3rem,15vw,5.6rem);line-height:.9;margin:0;background:linear-gradient(100deg,var(--t5),#9B5CFF 40%,var(--t4) 70%,var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.tagline{font-size:1.15rem;font-weight:700;margin:0;max-width:30ch}
.facts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.facts li{display:flex;gap:12px;align-items:center;font-weight:600;color:var(--fg)}
.facts b{font-family:var(--display);font-weight:400;min-width:2.6ch;color:var(--t3)}
.start{height:62px;font-size:1.15rem}
body.intro .logo,body.intro .trail{visibility:hidden}
body.intro .rail,body.done .rail{display:none}
header,.trail{position:relative;z-index:2}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);box-shadow:0 14px 14px -4px var(--bg);margin-inline:-16px;padding-inline:16px;padding-block:6px 10px;display:flex;flex-direction:column;gap:12px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:14px;align-items:start;flex:1}
body.intro .stage,body.done .stage{grid-template-columns:minmax(0,1fr)}
main{min-width:0}
.feed{display:flex;flex-direction:column;gap:10px;padding-bottom:40vh}
.log{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px;border-left:4px solid var(--c)}
.log .n{font-family:var(--display);color:var(--muted);font-size:.85rem}
.log .t{min-width:0}
.log .t small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.log .t b{display:block;font-weight:800;overflow-wrap:anywhere}
.log .g{text-align:right;font-family:var(--display);font-size:.95rem;line-height:1.15;font-variant-numeric:tabular-nums}
.log .g span{display:block;font-family:var(--body);font-weight:800;font-size:.75rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:110px;scroll-margin-bottom:24px}
.card .prompt{font-size:clamp(1.6rem,7vw,2.5rem)}
.card.res{background:var(--tier);color:var(--on-tier);border-color:transparent}
.card.res.dim{color:var(--fg)}
.card.res.t5{background:linear-gradient(135deg,var(--t5),#9B5CFF 50%,var(--t4))}
.card.res.miss{background:var(--surface-2);color:var(--fg);border-color:var(--t0)}
.card .phrase{font-size:clamp(1.8rem,8.5vw,2.9rem)}
.card .big-pts{font-size:clamp(2.6rem,12vw,4rem)}
.card .grow-line{font-size:1.1rem}
.card .next{margin-top:0}
.card.res.miss .next,.card.res.dim .next{background:var(--fg);color:var(--bg)}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);height:min(58vh,440px);padding-top:34px}
.r-track{position:relative;height:100%;width:100%}
.r-ticks{position:absolute;inset:0 auto 0 0;display:flex;flex-direction:column;justify-content:space-between;font-size:.62rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1;transform:translateY(-.3em)}
.r-ticks span{position:relative;padding-left:12px}
.r-ticks span::before{content:"";position:absolute;left:0;top:50%;width:8px;height:2px;background:var(--line)}
.r-track::after{content:"";position:absolute;right:8px;top:0;bottom:0;width:10px;border-radius:99px;background:var(--surface-2)}
.r-fill{position:absolute;right:8px;bottom:0;width:10px;border-radius:99px;background:linear-gradient(0deg,#9B5CFF,var(--t5));height:0;z-index:1;transition:height .9s cubic-bezier(.2,.9,.3,1.15)}
.r-egg{position:absolute;right:-6px;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;transform:translateY(6px);transition:bottom .9s cubic-bezier(.2,.9,.3,1.15)}
.r-emoji{display:block;width:23px;height:46px;transition:width .9s cubic-bezier(.2,.9,.3,1.3),height .9s cubic-bezier(.2,.9,.3,1.3);filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--t5) 45%,transparent))}
.r-cm{font-family:var(--display);font-size:.8rem;line-height:1;white-space:nowrap;margin-bottom:4px;font-variant-numeric:tabular-nums}
.r-cm.bump{animation:bump .8s ease-out}
@keyframes bump{40%{color:var(--t5);transform:scale(1.4)}}
.grow-line{font-family:var(--display);font-size:1.3rem}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nick{display:flex;flex-direction:column;gap:6px;font-weight:700}
.nick span{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nick input{font:inherit;font-size:1.05rem;font-weight:700;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
.nick input:focus{border-color:var(--t4)}
.privacy{font-size:.8rem;color:var(--muted);margin:0;max-width:46ch}
.rk .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.9rem;color:var(--on-tier);background:var(--c)}
</style>
</head>
<body>

<div class="app">
  <div class="top">
  <header>
    <div class="logo">KARALLION</div>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Como funciona e modo teste">?</button>
  </header>
  <div class="trail" id="trail" aria-label="Progresso da rodada"></div>
  </div>
  <div class="stage">
    <main id="main"></main>
    <aside class="rail" id="rail" aria-label="Tamanho do karallion">
      <div class="r-track">
        <div class="r-ticks" aria-hidden="true"><span>30</span><span>25</span><span>20</span><span>15</span><span>10</span><span>5</span><span>0</span></div>
        <div class="r-fill" id="rFill"></div>
        <div class="r-egg" id="rEgg"><span class="r-cm" id="rCm">0 cm</span><svg class="r-emoji" id="rEmoji" viewBox="0 0 40 80" aria-hidden="true"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B061FF"/><stop offset=".55" stop-color="#7B2FD6"/><stop offset="1" stop-color="#4E1696"/></linearGradient></defs><path d="M13 62 C7 44 9 20 17 8 C21 1 31 3 30 13 C31 29 28 48 27 62 Z" fill="url(#eg)"/><ellipse cx="17" cy="22" rx="2.6" ry="9" fill="#fff" opacity=".28" transform="rotate(12 17 22)"/><path d="M8 61 Q20 51 32 61 L29 68 Q20 63 11 68 Z" fill="#3FBF4F"/><path d="M18 66 H22 L21.2 78 H18.8 Z" fill="#2E8C3A"/></svg></div>
      </div>
    </aside>
  </div>
</div>
<div id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

/* ---------- normalização e busca ---------- */
function norm(s){
  s = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  s = s.replace(/[-'’.]/g," ").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
  return s.replace(/^(ele|ela|fulano) /,"").replace(/^(ta|tava|esta|estava|ficou|ja) /,"").replace(/^(o|a|os|as|um|uma|uns|umas) /,"");
}
function singWord(w){
  if(w.length<4) return w;
  const rules=[[/oes$/,"ao"],[/aes$/,"ao"],[/aos$/,"ao"],[/ais$/,"al"],[/eis$/,"el"],[/ois$/,"ol"],[/uis$/,"ul"],[/ns$/,"m"],[/(r|z)es$/,"$1"],[/s$/,""]];
  for(const [re,rep] of rules) if(re.test(w)) return w.replace(re,rep);
  return w;
}
function candidates(n){
  const stripped=n.replace(/^(fc|ec|sc|ac|sport club|esporte clube|futebol clube|clube) /,"").replace(/ (fc|ec|sc|ac|afc|futebol clube|esporte clube|clube|de futebol)$/,"");
  if(stripped!==n && stripped) return [...new Set([...candidates(stripped), n])];
  const ws=n.split(" "), set=new Set([n]);
  set.add(ws.map(singWord).join(" "));
  set.add([singWord(ws[0]),...ws.slice(1)].join(" "));
  set.add([...ws.slice(0,-1),singWord(ws[ws.length-1])].join(" "));
  return [...set];
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const d=Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
const INDEX = {};
for(const p of DATA){
  const m=new Map();
  for(const r of p.respostas) for(const a of r.aceitas){
    const k=norm(a); m.set(k,r); m.set(k.replace(/ /g,""),r);
  }
  INDEX[p.id]=m;
}
function match(prompt,input){
  const n=norm(input); if(!n) return null;
  const m=INDEX[prompt.id];
  for(const c of candidates(n)){
    if(m.has(c)) return m.get(c);
    if(m.has(c.replace(/ /g,""))) return m.get(c.replace(/ /g,""));
  }
  if(n.length<5) return null;
  const tol = n.length>=10 ? 2 : 1;
  let best=null, bd=9;
  for(const [k,r] of m){ const d=lev(n,k); if(d<bd){bd=d;best=r} }
  return bd<=tol ? best : null;
}

/* ---------- rodada do dia ---------- */
function todayKey(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo"}).format(new Date()); }
function seeded(seed){
  let h=1779033703^seed.length;
  for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296};
}
const SPECIAL = {
  "2026-10-08": {ids:["cidades-santo","marcas","morreu","profissoes","selecao","oscar","jogo-do-bicho"], extra:"extra-cobras"}
};
DATA.push({id:"extra-cobras", extra:true, texto:"Qual o nome de grupo mais gay pra karallion já usado???", escondida:"cobras",
  respostas:[{id:"cobras", aceitas:["cobras","cobra"], tier:5}]});
INDEX["extra-cobras"]=new Map([["cobras",DATA[DATA.length-1].respostas[0]],["cobra",DATA[DATA.length-1].respostas[0]]]);
function pick(seed){
  if(SPECIAL[seed]){ const s=SPECIAL[seed]; return s.extra ? [...s.ids, s.extra] : [...s.ids]; }
  if(CALENDARIO[seed]){ const ok=CALENDARIO[seed].filter(id=>DATA.some(p=>p.id===id)); if(ok.length===PER_DAY) return ok; }
  const rnd=seeded(seed), ids=DATA.filter(p=>!p.extra).map(p=>p.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  return ids.slice(0,PER_DAY);
}

function countUp(el,to){
  if(reduced){el.textContent=to;return}
  const t0=performance.now(), dur=700;
  const step=now=>{const k=Math.min(1,(now-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step)};
  setTimeout(()=>requestAnimationFrame(step),180);
}
function confetti(canvas,n){
  if(reduced||!canvas) return;
  const ctx=canvas.getContext("2d"), dpr=devicePixelRatio||1;
  const W=canvas.width=canvas.offsetWidth*dpr, H=canvas.height=canvas.offsetHeight*dpr;
  const cols=["#FF2BD6","#3DA9FC","#2EE6A6","#FF9F1C","#FFFFFF","#FFE14D"];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.45,vx:(Math.random()-.5)*22*dpr,vy:(-Math.random()*22-6)*dpr,s:(5+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of ps){ p.vy+=.55*dpr; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
    if(++f<170 && canvas.isConnected) requestAnimationFrame(tick); else ctx.clearRect(0,0,W,H);
  })();
}

function apelido(){ return (store.get("karallion-apelido")||"").trim(); }
async function initCloud(){
  if(!/^https:\/\//.test(CFG.supabaseUrl||"") || !CFG.supabaseKey || CFG.supabaseKey.startsWith("COLE") || !window.supabase) return;
  try{
    const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"karallion-auth"}});
    let { data:{ session } } = await sb.auth.getSession();
    if(!session){ const { data, error } = await sb.auth.signInAnonymously(); if(error) throw error; session = data.session; }
    CLOUD.sb = sb; CLOUD.uid = session.user.id; CLOUD.ok = true;
    const env = store.get("karallion-enviados-"+DAY) || {};
    CLOUD.sent = env.r || {}; CLOUD.sentRej = env.j || 0;
    await saveApelido();
    syncCloud();
    if(done()) renderRanking();
  }catch(e){ CLOUD.err = (e && e.message) || "erro"; console.warn("Karallion: sem conexão com o banco", e); }
}
function saveApelido(){
  if(!CLOUD.ok) return Promise.resolve();
  const a = (apelido() || "Anônimo").slice(0,24);
  CLOUD.chain = CLOUD.chain.then(()=>CLOUD.sb.from("jogadores").upsert({id:CLOUD.uid, apelido:a}, {onConflict:"id"})).then(({error}={})=>{ if(error) CLOUD.err=error.message; }, e=>{ CLOUD.err=e.message; });
  return CLOUD.chain;
}
function syncCloud(){
  if(!CLOUD.ok || G.label!=="dia") return;
  CLOUD.chain = CLOUD.chain.then(async()=>{
    const sb = CLOUD.sb, uid = CLOUD.uid;
    const novas = [];
    G.results.forEach((r,i)=>{
      if(!r) return; const cid = G.ids[i]; if(CLOUD.sent[cid]) return;
      novas.push({jogador_id:uid, dia:DAY, categoria_id:cid, texto:(r.texto||"").slice(0,80), resposta_id:r.rid||null, tier:r.tier||0, motivo:r.tier?"acerto":(r.motivo||"errou")});
    });
    if(novas.length){
      const { error } = await sb.from("respostas").upsert(novas, {onConflict:"jogador_id,dia,categoria_id", ignoreDuplicates:true});
      if(error) throw error;
      novas.forEach(n=>{ CLOUD.sent[n.categoria_id]=1; });
    }
    const rej = rejected.filter(r=>r.dia===DAY && r.cid);
    if(rej.length > CLOUD.sentRej){
      const lote = rej.slice(CLOUD.sentRej).map(r=>({jogador_id:uid, dia:DAY, categoria_id:r.cid, texto:String(r.resposta).slice(0,80)}));
      const { error } = await sb.from("recusadas").insert(lote);
      if(error) throw error;
      CLOUD.sentRej = rej.length;
    }
    const res = {jogador_id:uid, dia:DAY, pontos:total(), cm:Math.min(30,cmNow(total())), faixas:G.results.map(r=>r?(r.tier||0):0), completo:G.results.length>=G.ids.length && !G.showing, atualizado_em:new Date().toISOString()};
    const key = JSON.stringify({...res, atualizado_em:0});
    if(key !== CLOUD.lastRes){
      const { error } = await sb.from("resultados").upsert(res, {onConflict:"jogador_id,dia"});
      if(error) throw error;
      CLOUD.lastRes = key;
    }
    store.set("karallion-enviados-"+DAY, {r:CLOUD.sent, j:CLOUD.sentRej});
    CLOUD.err = null;
  }).catch(e=>{ CLOUD.err = (e && e.message) || "erro"; console.warn("Karallion: falha ao salvar", e); });
}
async function showPercent(p, r){
  if(!CLOUD.ok || G.label!=="dia" || !r.rid || p.extra) return;
  await CLOUD.chain;
  const { data, error } = await CLOUD.sb.rpc("percentual_resposta", {p_dia:DAY, p_categoria:p.id, p_resposta_id:r.rid});
  const el = $("pct"); if(error || !data || !data[0] || !el) return;
  const iguais = Number(data[0].iguais)||0, tot = Math.max(1, Number(data[0].total)||0), outros = Math.max(0, iguais-1);
  el.textContent = outros===0 ? "Ninguém mais deu essa resposta hoje. Por enquanto." :
    `${outros} ${outros===1?"pessoa também respondeu":"pessoas também responderam"} isso hoje (${Math.round(iguais/tot*100)}% dos acertos).`;
}
let rankSeq = 0;
async function renderRanking(){
  const box = $("ranking"); if(!box) return;
  if(G.label!=="dia"){ box.innerHTML = `<p class="note">Rodadas de treino não entram no ranking.</p>`; return; }
  if(!CLOUD.ok){ box.innerHTML = (/^https:/.test(CFG.supabaseUrl||"") && !CLOUD.err) ? `<h3>Ranking de hoje</h3><p class="note">Carregando o ranking…</p>` : ""; return; }
  const seq = ++rankSeq;
  syncCloud(); await CLOUD.chain;
  const { data, error } = await CLOUD.sb.rpc("ranking_do_dia", {p_dia:DAY});
  if(seq!==rankSeq || !$("ranking")) return;
  if(error){ box.innerHTML = `<h3>Ranking de hoje</h3><p class="note">Não deu pra carregar o ranking agora. Tente de novo daqui a pouco.</p>`; return; }
  const em = f => (f||[]).map(x=>x?TIERS[x].emoji:"❌").join("");
  const corDe = c => c>20 ? "var(--t5)" : c>=10 ? "var(--t3)" : "var(--t2)";
  box.innerHTML = `<h3>Ranking de hoje</h3>` + (data.length ? data.map((r,i)=>`<div class="rk ${r.sou_eu?"me":""}"><span class="pos">${i+1}</span>
      <span class="av" style="--c:${corDe(r.cm)}">${esc((r.apelido||"?").trim().charAt(0).toUpperCase()||"?")}</span>
      <div class="nm"><b>${r.sou_eu?"Você":esc(r.apelido||"Anônimo")}</b><span>${em(r.faixas)}</span></div>
      <span class="p">🍆 ${r.cm} cm</span></div>`).join("") : `<p class="note">Ninguém terminou a rodada de hoje ainda.</p>`);
}
initCloud();

$("menuBtn").onclick=openSheet;
render();
</script>
</body>
